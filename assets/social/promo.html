<!doctype html>
<!-- Title, time-lapse and call-to-action cards for the Norita teaser video (1280x720).
     Open with ?title, ?lapse, ?cta, ?wltitle or ?wlcta. Rendered by teaser.js. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#4aa8f0}
.scene{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);display:none;flex-direction:column;align-items:center;text-align:center;gap:18px}
body.title .card.t, body.cta .card.c, body.wltitle .card.wt, body.wlcta .card.wc{display:flex}
.logo{width:208px;height:208px;image-rendering:pixelated;filter:drop-shadow(0 8px 0 rgba(40,20,5,.45));animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
h1{font:76px 'Press Start 2P',monospace;color:#fff4dc;letter-spacing:2px;animation:rise .6s .35s both;
  text-shadow:5px 0 0 #3b2412,-5px 0 0 #3b2412,0 5px 0 #3b2412,0 -5px 0 #3b2412,7px 7px 0 #3b2412}
h1 b{color:#f2b53a;font-weight:inherit}
h2{font:34px 'Press Start 2P',monospace;color:#fff4dc;line-height:1.4;animation:rise .6s .1s both;
  text-shadow:4px 0 0 #3b2412,-4px 0 0 #3b2412,0 4px 0 #3b2412,0 -4px 0 #3b2412,5px 5px 0 #3b2412}
.sub{font:400 44px 'Jersey 10',sans-serif;color:#fff4dc;background:rgba(59,36,18,.88);border:4px solid #f2b53a;border-radius:8px;padding:4px 24px;
  box-shadow:0 6px 0 rgba(0,0,0,.35);animation:rise .6s .7s both}
.steps{display:flex;gap:18px;animation:rise .6s .4s both}
.step{display:flex;align-items:center;gap:12px;font:400 44px 'Jersey 10',sans-serif;color:#3b2412;background:#fbeccb;border:5px solid #5c3a1a;
  border-radius:8px;padding:8px 22px 8px 12px;box-shadow:inset 0 0 0 3px #e2c38a,0 6px 0 rgba(40,20,5,.45)}
.step i{font:20px 'Press Start 2P',monospace;font-style:normal;color:#1f3a10;background:#7cc644;border:4px solid #3b2412;border-radius:6px;width:46px;height:46px;display:grid;place-items:center}
.step:nth-child(2){animation:rise .5s .6s both}.step:nth-child(3){animation:rise .5s .8s both}
.c .logo,.wc .logo{width:150px;height:150px}
.url{white-space:nowrap;font:26px 'Press Start 2P',monospace;color:#3b2412;background:#fbeccb;border:5px solid #5c3a1a;border-radius:8px;padding:18px 26px;box-shadow:inset 0 0 0 3px #e2c38a,0 6px 0 rgba(40,20,5,.45);animation:rise .6s .5s both}
.soon{font:400 40px 'Jersey 10',sans-serif;color:#1f3a10;background:#f2b53a;border:5px solid #3b2412;border-radius:8px;padding:2px 26px;box-shadow:0 6px 0 #3b2412;animation:rise .6s 1.1s both}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
</style></head>
<body>
<div class="card t">
  <img class="logo" src="../logo.svg" alt="">
  <h1>Nori<b>ta</b></h1>
  <p class="sub">A cozy pixel farm on Elysium</p>
</div>
<div class="card c">
  <img class="logo" src="../logo.svg" alt="">
  <h2>Whitelist is open</h2>
  <div class="steps"><span class="step"><i>1</i>Follow</span><span class="step"><i>2</i>Like</span><span class="step"><i>3</i>Quote</span></div>
  <p class="soon">Early access soon</p>
</div>
<div class="card wt">
  <img class="logo" src="../logo.svg" alt="">
  <h1>Whitelist</h1>
  <p class="sub">Claim your Norita spot in 3 steps</p>
</div>
<div class="card wc">
  <img class="logo" src="../logo.svg" alt="">
  <h2>Claim your spot</h2>
  <p class="url">norita-3fkc.vercel.app/farm</p>
  <p class="soon">Early access soon</p>
</div>
<script>document.body.className = (location.search || location.hash).slice(1) || "title";</script>
<script>window.FARM_SCENE_PX = 4;</script>
<script src="../../farm/scene.js"></script>
</body></html>
